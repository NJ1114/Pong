<!DOCTYPE html>
<html>
    <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        html, body {
            height: 100%;
            margin: 0;
        }
        body {
            background: black;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
        }
        div {
            display: inline-block;
            border: 4px solid white;
            padding: 100px;
            text-align: center;
            margin-left: 500px;
            margin-top: 200px;
        }
        p {
            font-size: 20px;
        }
        .button {
            background-color: white;
            color: black;
            padding: 15px 32px;
            font-size: 26px;
            text-align: center;
            cursor: pointer;
            text-decoration: none;
            border: none;
            display: inline-block;
            margin-bottom: 5px;
        }
        .button:active {
            background-color: black;
            color: white;
        }
    </style>
    </head>
    <body>
        <div>
            <h1>Left Player Keys</h1>
                <p>w = Up</p>
                <p>s = Down</p><br>
            <h1>Right Player Keys</h1>
                <p>Up arrow key = Up</p>
                <p>Down arrow key = Down</p><br>
            <button onclick="document.location = 'pong 2.html'" class="button">Play</button>
        </div>
    </body>
</html>
