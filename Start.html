<!DOCTYPE html>
<html>
    <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        html, body {
            height: 100%;
            margin: 0;
        }
        body {
            background: black;
            color: white;
            font-family: Arial, Helvetica, sans-serif;

            }
        div {
            display: inline-block;
            border: 4px solid white;
            padding: 100px;
            text-align: center;
            margin-left: 500px;
            margin-top: 200px;
        }
        p {
            vertical-align: middle;
        }
        .button {
            background-color: white;
            color: black;
            padding: 15px 32px;
            font-size: 26px;
            text-align: center;
            cursor: pointer;
            text-decoration: none;
            border: none;
            display: inline-block;
            margin-bottom: 5px;
        }
        .button:active {
            background-color: black;
            color: white;
        }
        .controls {
            vertical-align: middle;
            background-color: white;
            color: black;
            padding: 15px 32px;
            font-size: 24px;
            text-align: center;
            cursor: pointer;
            text-decoration: none;
            border: none;
            display: block;
        }
        .controls:active {
            background-color: black;
            color: white;
        }
    </style>
    </head>
    <body>
        <div>
            <p style="font-size: 80px;">Pong</p>
            <button onclick="document.location = 'controls.html'" class="button">Start</button>
        </div>
    </body>
</html>
